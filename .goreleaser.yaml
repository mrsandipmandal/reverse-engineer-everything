version: 2

project_name: ree

before:
  hooks:
    - go mod verify

builds:
  - id: ree
    main: ./cmd/ree
    binary: ree
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/mrsandipmandal/reverse-engineer-everything/internal/version.Version={{ .Version }}
      - -X github.com/mrsandipmandal/reverse-engineer-everything/internal/version.Commit={{ .Commit }}
      - -X github.com/mrsandipmandal/reverse-engineer-everything/internal/version.Built={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: ree
    ids:
      - ree
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive

signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs(\\(.+\\))?:"
      - "^test(\\(.+\\))?:"
      - "^ci(\\(.+\\))?:"
      - "^chore(\\(.+\\))?:"
      - "^build(\\(.+\\))?:"
      - "^style(\\(.+\\))?:"

release:
  draft: false
  prerelease: auto
  name_template: "REE {{ .Version }}"
  header: |
    Evidence-first reverse engineering for binaries, apps, and artifacts.

    This release ships the `ree` CLI with `analyze`, `inventory`, `search`, and `compare`, the stdio MCP server (`ree mcp`, surface 0.3) with `ree_version`, `ree_doctor`, and `ree_analyze` for ELF, PE, Mach-O, ZIP, tar, gzip, APK, ASAR, and property-list artifacts, and signed archives for linux, darwin, and windows on amd64 and arm64.

    The full changelog is in [CHANGELOG.md](https://github.com/mrsandipmandal/reverse-engineer-everything/blob/{{ .Tag }}/CHANGELOG.md).
  footer: |
    **Verify this release**

    ```bash
    ./scripts/verify-release.sh {{ .Tag }}
    ```

    Checksums and a keyless cosign bundle are attached. SBOMs are published next to each archive.
